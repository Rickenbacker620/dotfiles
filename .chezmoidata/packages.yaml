linux-arch:
  packageManager:
    update: "sudo pacman -Syu --noconfirm"
    install: "sudo pacman -S --noconfirm --needed"
  packages:
    essential:
      - openssh
      - 7zip
      - base-devel
    desktop:
      - hyprland
      - waybar
      - wl-clipboard
      - wofi
      - kitty
      - pipewire
      - wireplumber
      - brightnessctl
      - fcitx5-im
      - bluez
      - bluez-utils
      - hyprpaper
      - power-profiles-daemon
      - mpv
      - libvirt
      - virt-manager
      - noto-fonts
      - noto-fonts-cjk
      - noto-fonts-emoji
      - noto-fonts-extra
      - ttf-jetbrains-mono-nerd
      - ttf-font-awesome
      - powerline
      - powerline-fonts

linux-debian:
  packageManager:
    update: "sudo apt-get update"
    install: "sudo apt-get install -y"
  packages:
    essential:
      - build-essential
      - openssh-client
      - openssh-server
      - ca-certificates
      - gnupg
    desktop:
      - mpv
      - libvirt-daemon
      - virt-viewer
      - fonts-noto
      - fonts-noto-cjk
      - fonts-noto-color-emoji

darwin:
  packageManager:
    update: "brew update"
    install: "brew install"
    installCask: "brew install --cask"
  packages:
    essential:
      - openssh
    desktop:
      - font-monaspace-nf