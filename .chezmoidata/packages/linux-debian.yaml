# fish is installed by mise (aqua:fish-shell/fish-shell), not apt - see
# .config/mise/config.toml; distro fish is too old (we want 4.x, the Rust one).
linux-debian:
  packageManager:
    update: "sudo apt-get update"
    install: "sudo apt-get install -y"
  packages:
    essential:
      - build-essential
      - openssh-client
      - openssh-server
      - ca-certificates
      - gnupg
      - git
      - wget
    desktop:
      - mpv
      - libvirt-daemon
      - virt-viewer
      - fonts-noto
      - fonts-noto-cjk
      - fonts-noto-color-emoji
