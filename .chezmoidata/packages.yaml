linux-arch:
  packageManager:
    update: "sudo pacman -Syu --noconfirm"
    install: "sudo pacman -S --noconfirm --needed"
  packages:
    essential:
      - openssh
      - 7zip
      - base-devel
    desktop:
      - hyprland
      - waybar
      - wl-clipboard
      - wofi
      - ghostty
      - pipewire
      - wireplumber
      - brightnessctl
      - fcitx5-im
      - bluez
      - bluez-utils
      - hyprpaper
      - power-profiles-daemon
      - mpv
      - libvirt
      - virt-manager
      - noto-fonts
      - noto-fonts-cjk
      - noto-fonts-emoji
      - noto-fonts-extra
      - ttf-jetbrains-mono-nerd
      - ttf-font-awesome
      - powerline
      - powerline-fonts

linux-debian:
  packageManager:
    update: "sudo apt-get update"
    install: "sudo apt-get install -y"
  packages:
    essential:
      - build-essential
      - openssh-client
      - openssh-server
      - ca-certificates
      - gnupg
    desktop:
      - mpv
      - libvirt-daemon
      - virt-viewer
      - fonts-noto
      - fonts-noto-cjk
      - fonts-noto-color-emoji

linux-ubuntu:
  packageManager:
    update: "sudo apt-get update"
    install: "sudo apt-get install -y"
  packages:
    essential:
      - build-essential
      - openssh-client
      - openssh-server
      - ca-certificates
      - gnupg
    desktop:
      - mpv
      - libvirt-daemon
      - virt-viewer
      - fonts-noto
      - fonts-noto-cjk
      - fonts-noto-color-emoji

linux-amzn:
  packageManager:
    update: "sudo yum update -y"
    install: "sudo yum install -y"
  packages:
    essential:
    desktop:

darwin:
  packageManager:
    update: "brew update"
    install: "brew install"
    installCask: "brew install --cask"
  packages:
    essential:
      - openssh
      - git
    desktop:
      - font-monaspace-nf
      - google-chrome
      - ghostty
      - keka
      - iina
      - steam
      - wechat
      - baidunetdisk
      - neteasemusic
      - telegram
      - visual-studio-code
      - claude
      - clash-verge-rev
      - betterdisplay
      - snipaste

windows:
  packageManager:
    install: "winget install --accept-source-agreements --accept-package-agreements --exact --id"
  packages:
    essential:
      - Git.Git
      - 7zip.7zip
      - jdx.mise
    desktop:
      - abbodi1406.vcredist
      - Bandisoft.Honeyview
      - ClashVergeRev.ClashVergeRev
      - Daum.PotPlayer
      - Google.Chrome
      - PIKCLOUD.PikPak
      - RARLab.WinRAR
      - Valve.Steam
      - Tencent.WeChat.Universal
      - qBittorrent.qBittorrent
      - Baidu.BaiduNetdisk
      - NetEase.CloudMusic
      - Comfy.ComfyUI-Desktop
      - Ollama.Ollama
      - Telegram.TelegramDesktop
      - Microsoft.VisualStudioCode
      - Microsoft.PowerToys
      - Anthropic.Claude