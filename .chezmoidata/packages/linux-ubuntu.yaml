linux-ubuntu:
  packageManager:
    update: "sudo apt-get update"
    install: "sudo apt-get install -y"
  packages:
    essential:
      - build-essential
      - openssh-client
      - ca-certificates
      - gnupg
      - git
      - wget
      - procps
      - file
    desktop:
      - libvirt-daemon
      - virt-viewer
      - fonts-noto
      - fonts-noto-cjk
      - fonts-noto-color-emoji
